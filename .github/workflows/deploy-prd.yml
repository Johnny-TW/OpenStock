name: CD — Deploy to PRD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  ci-check:
    name: CI Gate
    uses: ./.github/workflows/github-ci.yml

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [ci-check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:prd
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:prd-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:prd
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:prd-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_API_HOST=${{ vars.PRD_API_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to PRD Server
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # environment: prd
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRD_SERVER_HOST }}
          username: ${{ secrets.PRD_SERVER_USER }}
          key: ${{ secrets.PRD_SERVER_SSH_KEY }}
          script: |
            cd /opt/stocksmart
            docker compose -f docker-compose.prd.yml pull
            docker compose -f docker-compose.prd.yml up -d
            docker image prune -f
            echo "✅ PRD 部署完成：$(date)"
